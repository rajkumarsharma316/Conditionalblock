name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Run Build
        run: npm run build

      - name: Run Unit Tests
        run: npm run test:unit || npm test

      - name: Run Integration Tests
        run: npm run test:integration || echo "Integration tests not configured"

      - name: Run Linting and Type Check
        run: npm run lint && npm run type-check || echo "Linting/type-check not configured"
